[project]
name = "jadaun"
version = "0.1.0"
description = "Dynamic Django app discovery + folder/router-based URL generation"
readme = "README.md"
authors = [{ name = "jadaun-abhay", email = "jadaunabhaysingh220@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
